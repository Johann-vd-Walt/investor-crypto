# ---------------------------------------------------------------------------
# HTTP-only bootstrap site for trade.mad-apps.co.za
#
# Solves the same chicken-and-egg as the school's bootstrap: the real TLS site
# references /etc/letsencrypt/live/<domain>/fullchain.pem, so nginx will not
# start until a cert exists — but certbot's webroot needs a working nginx.
#
# NOTE: no `default_server` here. The VirtualSchool site may already own the
# default. nginx routes by Host, so this block matches ONLY this domain and
# leaves the school's site untouched.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name trade.mad-apps.co.za;

    # Let certbot prove domain control (shared webroot with the school).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 503;
    }
    error_page 503 /holding.html;
    location = /holding.html {
        root /var/www/certbot;
        internal;
    }
}
