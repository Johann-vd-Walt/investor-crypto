# ---------------------------------------------------------------------------
# nginx site for Crypto Swing-Trader — trade.mad-apps.co.za
#
# Installed as /etc/nginx/sites-available/cryptotrader, symlinked into
# sites-enabled by enable-tls-crypto.sh once a certificate exists.
#
# Co-exists with the VirtualSchool site: separate server_name, separate
# upstream port (8001), separate web root. nginx picks the block by Host.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name trade.mad-apps.co.za;

    # Keep the ACME path reachable over HTTP so renewals work.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trade.mad-apps.co.za;

    # certbot fills these in (enable-tls-crypto.sh runs it before enabling this site).
    ssl_certificate     /etc/letsencrypt/live/trade.mad-apps.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trade.mad-apps.co.za/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- the built React app ------------------------------------------------
    root /srv/cryptotrader/frontend/dist;
    index index.html;

    location /assets/ {
        include /etc/nginx/snippets/cryptotrader-security.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/cryptotrader-security.conf;
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # SPA fallback for react-router.
    location / {
        include /etc/nginx/snippets/cryptotrader-security.conf;
        try_files $uri $uri/ /index.html;
    }

    # --- the API ------------------------------------------------------------
    location ~ ^/(api|docs|redoc|openapi.json) {
        include /etc/nginx/snippets/cryptotrader-security.conf;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
