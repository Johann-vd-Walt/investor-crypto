# Security headers for the crypto site, installed to
# /etc/nginx/snippets/cryptotrader-security.conf and INCLUDED into every location
# block. nginx does not merge add_header across levels — a location that sets any
# add_header of its own discards inherited ones — so these must be included in
# each location rather than set once at server level.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# The SPA loads no third-party scripts/fonts/images and talks only to its own
# /api (Binance etc. are fetched server-side), so connect-src can be 'self'.
# 'unsafe-inline' is needed for style-src (React + charting set inline styles);
# it is deliberately NOT granted to script-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
